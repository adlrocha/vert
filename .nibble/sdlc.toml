# Read by nibble-review from the default branch, and by `nibble land` and `nibble sdlc`.
# `nibble sdlc runbook` explains every setting. `mode = "off"` stops land here.
[land]
mode = "enforce"
profile = "side-project"
authors = ["adlrocha"]
required_checks = ["test", "review"]
always_human = ["install.sh", "src/explain/agent.rs", "src/explain/cache.rs", "src/git/commit.rs"]

[land.ask_when]
authority = "It widens what a coding agent may read, edit, or run, or what vert commits"
